# -----------------------------------------------------------------------------
# 2. RÉGIME SOCIAL DES TRAVAILLEURS NON SALARIÉS (TNS)
#    Gérant majoritaire de SARL/EURL à l'IS, artisan, commerçant.
#    Réforme de l'assiette sociale unique en vigueur.
# -----------------------------------------------------------------------------
social_tns:

  assiette:
    rule_id: SOCIAL_TNS_001
    title: Assiette sociale unique des travailleurs indépendants
    population: "Travailleurs indépendants non agricoles affiliés au régime général"
    formule: |
      R  = revenu professionnel brut ("super-brut")
         = pour une société à l'IS : coût total supporté par la société au titre
           du dirigeant, hors cotisations facultatives Madelin
         = rémunération nette versée + cotisations et contributions sociales
           obligatoires (y compris CSG/CRDS)
      abattement = min( max( 26% x R ; plancher ) ; plafond )
      A = R - abattement          <- assiette UNIQUE des cotisations ET de la CSG/CRDS
    taux_abattement: 0.26
    plancher_abattement_pct_pass: 0.0176   # 845,86 € en 2026
    plafond_abattement_pct_pass: 1.30      # 62 478 € en 2026
    effective_from: "2025-01-01"
    source_type: legislation
    source_reference: "Art. L.136-3 III et L.131-6 CSS ; art. D.136-5 CSS créé par décret n° 2024-688 du 5 juillet 2024"
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000048838330"
    last_verified: "2026-08-08"
    confidence: high
    note: >-
      La réforme supprime le calcul circulaire cotisations/assiette. L'abattement
      forfaitaire de 26 % remplace la déduction des cotisations réellement payées.
      Conséquence pour le moteur : le calcul devient déterministe et non itératif.

  maladie_maternite:
    rule_id: SOCIAL_TNS_002
    title: Cotisation maladie-maternité
    assiette: "A (totalité, non plafonnée)"
    mode: >-
      Deux étages, art. D.621-1 CSS : taux de base 8,50 % sur la fraction de
      l'assiette n'excédant pas 3 PASS, 6,50 % sur la fraction au-delà (taux
      MARGINAL sur l'excédent, et non taux unique sur la totalité). Le taux
      applicable à la fraction sous 3 PASS fait en outre l'objet d'une réduction
      dégressive lorsque l'assiette TOTALE est inférieure à 3 PASS (art. D.621-2
      CSS) : dans cette zone le taux réduit s'applique à la totalité de l'assiette.
      La cotisation résultante est continue et croissante en tout point : il
      n'existe aucune discontinuité ni « falaise » à 3 PASS.
    taux_base: 0.0850
    seuil_fraction_superieure_pct_pass: 3.00
    taux_fraction_superieure: 0.0650
    bareme_reduction_pct_pass:  # art. D.621-2 : réduction du taux de base sous 3 PASS
      - { de: 0.00, a: 0.20, taux_debut: 0.000, taux_fin: 0.000 }
      - { de: 0.20, a: 0.40, taux_debut: 0.000, taux_fin: 0.015 }
      - { de: 0.40, a: 0.60, taux_debut: 0.015, taux_fin: 0.040 }
      - { de: 0.60, a: 1.10, taux_debut: 0.040, taux_fin: 0.065 }
      - { de: 1.10, a: 2.00, taux_debut: 0.065, taux_fin: 0.077 }
      - { de: 2.00, a: 3.00, taux_debut: 0.077, taux_fin: 0.085 }
    droits_generes: "Prestations en nature maladie-maternité (non contributives, non proportionnelles)"
    caractere: "solidarite"
    source_reference: "Art. D.621-1 et D.621-2 CSS (décret n° 2024-688 du 5 juillet 2024)"
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000049904610"
    last_verified: "2026-08-08"
    confidence: high
    note: >-
      DIVERGENCE LEVÉE le 2026-08-08 sur texte primaire. D.621-1 fixe bien le
      décrochage à 3 PASS (et non 5 PASS), mais 6,50 % est un taux marginal sur
      la seule fraction excédentaire. Le référentiel antérieur l'appliquait à la
      totalité de l'assiette, ce qui fabriquait une discontinuité descendante
      inexistante. Aucune cotisation minimale maladie n'existe depuis la LFSS
      2017 : le taux est nul sous 20 % du PASS (D.621-2, 1°).

  indemnites_journalieres:
    rule_id: SOCIAL_TNS_003
    title: Cotisation indemnités journalières
    assiette: "A plafonnée à 5 PASS"
    taux: 0.0050
    assiette_minimale_pct_pass: 0.40
    plafond_pct_pass: 5.0
    cotisation_minimale_eur: 96
    plafond_ij_journaliere_pct_pass: 1.0   # 1 PASS / 730 = 65,84 € au 01/01/2026
    diviseur_ij: 730
    droits_generes: "Indemnités journalières maladie, plafonnées à 1/730 de 1 PASS/jour (65,84 € au 01/01/2026)"
    caractere: "contributif_partiel"
    source_reference: "Art. D.621-3 CSS (taux 0,50 %, assiette plafonnée à 5 PASS, minimum 40 % PASS) ; ameli.fr — IJ artisans-commerçants 2026"
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000049904537"
    last_verified: "2026-08-08"
    confidence: high
    note: >-
      CORRECTION 2026-08-08 : le plafond d'IJ était fixé à 3 PASS/730, valeur qui
      ne vaut que pour les professions libérales réglementées (L.640-1). Pour les
      artisans et commerçants (L.631-1), population modélisée par le moteur, le
      plafond est de 1 PASS/730, soit 65,84 € bruts par jour en 2026. La
      valorisation des droits générés était surestimée d'un facteur 3.

  retraite_base:
    rule_id: SOCIAL_TNS_004
    title: Cotisation vieillesse de base
    tranches:
      - { libelle: "T1", assiette: "A plafonnée à 1 PASS", taux: 0.1787 }
      - { libelle: "déplafonnée", assiette: "A totalité", taux: 0.0072 }
    cotisation_minimale_eur: 967
    assiette_minimale: "450 x SMIC horaire (art. D.633-2 CSS)"
    droits_generes: "Trimestres + report au compte pour le revenu annuel moyen (25 meilleures années, plafonné à 1 PASS)"
    caractere: "contributif_sous_1_pass"
    source_reference: "Art. D.633-2 CSS ; barème URSSAF 2026 (taux relevés au 1er janvier 2025 par le décret n° 2024-688)"
    last_verified: "2026-08-08"
    confidence: medium
    note: >-
      DIVERGENCE MINEURE : un support d'expert-comptable maintient 17,15 %.
      Cinq sources professionnelles 2026 convergent sur 17,87 % + 0,72 %.
      Valeur retenue : 17,87 % / 0,72 %.

  retraite_complementaire_rci:
    rule_id: SOCIAL_TNS_005
    title: Retraite complémentaire des indépendants (RCI)
    tranches:
      - { libelle: "T1", de_pct_pass: 0.0, a_pct_pass: 1.0, taux: 0.081 }
      - { libelle: "T2", de_pct_pass: 1.0, a_pct_pass: 4.0, taux: 0.091 }
      - { libelle: "au-delà", de_pct_pass: 4.0, a_pct_pass: null, taux: 0.0 }
    droits_generes: "Points RCI"
    caractere: "contributif"
    source_reference: "Barème URSSAF / SSI 2026 (taux relevés au 1er janvier 2025)"
    last_verified: "2026-08-08"
    confidence: medium

  invalidite_deces:
    rule_id: SOCIAL_TNS_006
    title: Cotisation invalidité-décès
    assiette: "A plafonnée à 1 PASS"
    taux: 0.0130
    assiette_minimale_pct_pass: 0.115
    cotisation_minimale_eur: 72
    droits_generes: "Pension d'invalidité, capital décès"
    caractere: "contributif_partiel"
    source_reference: "Art. D.632-1 CSS ; barème URSSAF 2026"
    last_verified: "2026-08-08"
    confidence: medium

  allocations_familiales:
    rule_id: SOCIAL_TNS_007
    title: Cotisation allocations familiales
    assiette: "A (totalité)"
    mode: "taux unique applicable à la totalité de l'assiette"
    bareme_pct_pass:
      - { de: 0.00, a: 1.10, taux_debut: 0.000, taux_fin: 0.000 }
      - { de: 1.10, a: 1.40, taux_debut: 0.000, taux_fin: 0.031 }
      - { de: 1.40, a: null, taux_debut: 0.031, taux_fin: 0.031 }
    droits_generes: "Aucun droit personnel proportionnel"
    caractere: "solidarite"
    source_reference: "Art. D.242-11 CSS ; barème URSSAF 2026"
    last_verified: "2026-08-08"
    confidence: high

  csg_crds:
    rule_id: SOCIAL_TNS_008
    title: CSG et CRDS sur revenus d'activité indépendante
    assiette: "A (assiette unique, non plafonnée)"
    taux_csg: 0.0920
    taux_crds: 0.0050
    taux_total: 0.0970
    part_csg_deductible: 0.0680
    droits_generes: "Aucun"
    caractere: "solidarite"
    source_reference: "Art. L.136-3 et L.136-8 I 1° CSS"
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054336623"
    last_verified: "2026-08-08"
    confidence: high
    note: >-
      La hausse de CSG de la LFSS 2026 vise les REVENUS DU CAPITAL (art. L.136-6
      et L.136-7 CSS), pas les revenus d'activité. Le taux d'activité reste 9,7 %.
      Confiance relevée à high le 2026-08-08 : taux fixés par l'art. L.136-8 I 1°
      CSS lu sur Légifrance, inchangés depuis 2018.
      La part déductible de 6,8 % n'a pas été reconfirmée explicitement pour 2026
      dans les sources consultées : confidence medium.

  formation_professionnelle:
    rule_id: SOCIAL_TNS_009
    title: Contribution à la formation professionnelle
    assiette: "1 PASS (forfaitaire)"
    taux_commercant: 0.0025
    taux_artisan: 0.0029
    droits_generes: "Droit à la formation professionnelle"
    source_reference: "Art. L.6331-48 code du travail"
    last_verified: "2026-08-08"
    confidence: medium

  dividendes_seuil_10:
    rule_id: SOCIAL_TNS_010
    title: Assujettissement aux cotisations TNS de la fraction de dividendes excédant 10 % du montant de référence
    population: "Travailleur indépendant exerçant dans une société soumise à l'IS, son conjoint/partenaire, ses enfants mineurs"
    texte: >-
      Est réintégrée dans l'assiette sociale la part des dividendes et des
      sommes versées en compte courant qui excède 10 % d'un montant de référence
      constitué du capital social, primes d'émission incluses, détenu en toute
      propriété ou en usufruit par ces mêmes personnes, et des sommes inscrites
      dans leurs comptes courants d'associés.
    montant_reference: "capital social libéré + primes d'émission + solde moyen annuel des comptes courants d'associés"
    date_appreciation: "dernier jour de l'exercice précédant la distribution"
    taux_seuil: 0.10
    traitement_fraction_excedentaire: "intégrée dans R, donc soumise à l'abattement de 26 % puis à l'ensemble des cotisations et à la CSG/CRDS d'activité"
    traitement_fraction_sous_seuil: "revenu de capitaux mobiliers de droit commun : PFU ou barème + prélèvements sociaux du capital"
    source_type: legislation
    source_reference: "Art. L.136-3 II 2° CSS ; modalités de calcul art. R.131-7 CSS"
    source_url: "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000048838330"
    last_verified: "2026-08-08"
    confidence: high
    note: >-
      Le compte courant est retenu pour son SOLDE MOYEN ANNUEL (moyenne des
      soldes mensuels moyens), pas pour son solde ponctuel. Erreur fréquente.

  prise_en_charge_cotisations_par_societe:
    rule_id: SOCIAL_TNS_011
    title: Prise en charge par la société des cotisations personnelles du dirigeant TNS
    qualification: >-
      La prise en charge par la société des cotisations sociales personnelles du
      gérant constitue un complément de rémunération. Elle est déductible du
      résultat de la société au même titre que la rémunération, et elle entre
      dans le revenu professionnel du dirigeant.
    effet_moteur: >-
      Sous le régime de l'assiette unique post-réforme, la prise en charge est
      DÉJÀ intégrée : le "revenu brut" R correspond au coût total supporté par
      la société, que les cotisations soient payées par la société ou prélevées
      par le dirigeant sur sa rémunération. Il n'y a donc PAS d'effet de boucle
      supplémentaire, et PAS de gain mécanique à la prise en charge.
    confidence: medium
    statut_juridique: "interpretation_a_confirmer"
    source_reference: "Doctrine constante sur la qualification de complément de rémunération ; conséquence tirée de la nouvelle assiette L.136-3 CSS"
    last_verified: "2026-08-08"
    note: >-
      GARDE-FOU. Le moteur ne présente jamais la prise en charge comme un gain.
      Il la traite comme une modalité de trésorerie, neutre en valeur globale,
      et la classe en robustesse C (validation recommandée) tant que le
      traitement n'est pas confirmé sur source primaire pour le cas d'espèce.
      La fraction de cotisations afférente à des DIVIDENDES réintégrés fait
      l'objet d'une qualification distincte et n'est pas automatisée.

# -----------------------------------------------------------------------------
# 3. RÉGIME SOCIAL DU DIRIGEANT ASSIMILÉ SALARIÉ
#    Président de SAS/SASU, gérant minoritaire ou égalitaire de SARL.
# -----------------------------------------------------------------------------
social_assimile_salarie:

  principe:
    rule_id: SOCIAL_AS_001
    title: Champ des cotisations du mandataire social assimilé salarié
    exclusions:
      assurance_chomage: "Non assujetti : le mandataire social sans contrat de travail ne relève pas de l'assurance chômage."
      ags: "Non assujetti (garantie réservée aux titulaires d'un contrat de travail)."
      reduction_generale: >-
        Non éligible à la Réduction Générale Dégressive Unique (RGDU), qui exige
        une affiliation obligatoire à l'assurance chômage. Depuis la fusion des
        bandeaux maladie et famille au 1er janvier 2026, il n'existe plus aucune
        voie d'accès à un taux réduit maladie (7 %) ou famille (3,45 %) :
        le dirigeant assimilé salarié paie systématiquement les taux pleins.
    source_reference: "urssaf.fr (réduction générale) ; economie.gouv.fr (RGDU) ; Bpifrance Création"
    last_verified: "2026-08-08"
    confidence: high

  cotisations:
    rule_id: SOCIAL_AS_002
    title: Barème des cotisations 2026 (dirigeant assimilé salarié)
    # base : T1 = fraction du brut <= 1 PASS ; T2 = fraction entre 1 et 8 PASS ; TOT = totalité
    lignes:
      - { code: MAL,      libelle: "Maladie-maternité-invalidité-décès", base: TOT,  taux_salarial: 0.0000, taux_patronal: 0.1300, droits: "Prestations en nature", caractere: solidarite }
      - { code: VIEIL_P,  libelle: "Vieillesse plafonnée",               base: T1,   taux_salarial: 0.0690, taux_patronal: 0.0855, droits: "Trimestres + salaire annuel moyen", caractere: contributif }
      - { code: VIEIL_D,  libelle: "Vieillesse déplafonnée",             base: TOT,  taux_salarial: 0.0040, taux_patronal: 0.0211, droits: "Aucun droit proportionnel", caractere: solidarite }
      - { code: AF,       libelle: "Allocations familiales",             base: TOT,  taux_salarial: 0.0000, taux_patronal: 0.0525, droits: "Aucun", caractere: solidarite }
      - { code: ATMP,     libelle: "Accidents du travail",               base: TOT,  taux_salarial: 0.0000, taux_patronal: 0.0120, droits: "Couverture AT/MP", caractere: contributif_partiel, parametrable: true }
      - { code: FNAL,     libelle: "FNAL (< 50 salariés)",               base: T1,   taux_salarial: 0.0000, taux_patronal: 0.0010, droits: "Aucun", caractere: solidarite }
      - { code: CSA,      libelle: "Contribution solidarité autonomie",  base: TOT,  taux_salarial: 0.0000, taux_patronal: 0.0030, droits: "Aucun", caractere: solidarite }
      - { code: AA_T1,    libelle: "Agirc-Arrco T1 (appelé)",            base: T1,   taux_salarial: 0.0315, taux_patronal: 0.0472, droits: "Points Agirc-Arrco (acquis sur le taux contractuel 6,20 %)", caractere: contributif }
      - { code: AA_T2,    libelle: "Agirc-Arrco T2 (appelé)",            base: T2,   taux_salarial: 0.0864, taux_patronal: 0.1295, droits: "Points Agirc-Arrco (acquis sur le taux contractuel 17,00 %)", caractere: contributif }
      - { code: CEG_T1,   libelle: "Contribution d'équilibre général T1", base: T1,  taux_salarial: 0.0086, taux_patronal: 0.0129, droits: "Aucun", caractere: solidarite }
      - { code: CEG_T2,   libelle: "Contribution d'équilibre général T2", base: T2,  taux_salarial: 0.0108, taux_patronal: 0.0162, droits: "Aucun", caractere: solidarite }
      - { code: CET,      libelle: "Contribution d'équilibre technique",  base: T1T2, taux_salarial: 0.0014, taux_patronal: 0.0021, droits: "Aucun", caractere: solidarite, condition: "brut > 1 PASS" }
      - { code: APEC,     libelle: "APEC (cadres)",                       base: T1T2, taux_salarial: 0.00024, taux_patronal: 0.00036, droits: "Aucun", caractere: solidarite, parametrable: true }
      - { code: FORM,     libelle: "Contribution à la formation professionnelle (< 11 salariés)", base: TOT, taux_salarial: 0.0, taux_patronal: 0.0055, droits: "Aucun", caractere: solidarite, effectif_max: 10 }
      - { code: FORM11,   libelle: "Contribution à la formation professionnelle (>= 11 salariés)", base: TOT, taux_salarial: 0.0, taux_patronal: 0.0100, droits: "Aucun", caractere: solidarite, effectif_min: 11 }
      - { code: TA,       libelle: "Taxe d'apprentissage",                base: TOT,  taux_salarial: 0.0, taux_patronal: 0.0068, droits: "Aucun", caractere: solidarite }
      - { code: PEEC,     libelle: "Participation à l'effort de construction (>= 50 salariés)", base: TOT, taux_salarial: 0.0, taux_patronal: 0.0045, droits: "Aucun", caractere: solidarite, effectif_min: 50 }
      - { code: VM,       libelle: "Versement mobilité",                  base: TOT,  taux_salarial: 0.0, taux_patronal: 0.0000, droits: "Aucun", caractere: solidarite, parametrable: true }
    note_agirc_arrco: >-
      CORRECTION 2026-08-08 : les taux Agirc-Arrco portés ici étaient les taux
      CONTRACTUELS (6,20 % en T1, 17,00 % en T2) alors qu'ils sont étiquetés
      « appelé ». Les taux effectivement précomptés sont les taux appelés, égaux
      au contractuel majoré du taux d'appel de 127 % : 7,87 % en T1 (3,15 %
      salarial / 4,72 % patronal) et 21,59 % en T2 (8,64 % / 12,95 %), répartis
      selon la clé légale 40 / 60. Seul le taux contractuel génère des points de
      retraite : la conversion en points reste faite sur 6,20 % / 17,00 % via
      RETR_003. L'erreur sous-estimait les cotisations d'environ 21 %.
    note_perimetre: >-
      Le taux patronal global obtenu (de l'ordre de 39 % du brut pour une TPE)
      est inférieur aux 42-45 % couramment cités pour un salarié : le mandataire
      social ne supporte ni assurance chômage (4,05 %), ni AGS (0,25 %), et
      n'accède pas à la RGDU. Le versement mobilité est laissé à 0 par défaut :
      il dépend de la commune du siège et doit être renseigné.
    source_reference: "Barème URSSAF 2026 (LégiSocial, tableau CAPEB) ; Chiffr'Agirc-Arrco 2026 ; décret n° 2025-1446 du 31 décembre 2025 (vieillesse déplafonnée à 2,11 %)"
    source_url: "https://www.agirc-arrco.fr/storage/chiffrAA_2026_VF.pdf"
