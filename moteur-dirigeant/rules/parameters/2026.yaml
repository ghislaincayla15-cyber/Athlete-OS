    effectif_min_salaries: 1
    effectif_max_salaries: 249
    texte: >-
      Dispositifs ouverts aux entreprises employant au moins un salarié et moins
      de 250 salariés. Bénéficiaires : chefs d'entreprise ; présidents,
      directeurs généraux, gérants ou membres du directoire ; conjoint ou
      partenaire pacsé ayant le statut de conjoint collaborateur ou associé.
    exclusion: >-
      Un accord ne peut être conclu si l'unique salarié de l'entreprise est
      lui-même le président, le directeur général, le gérant ou un membre du
      directoire. Le dirigeant ne compte pas dans l'effectif.
    lissage_seuil: >-
      Le gel de 5 ans en cas de franchissement de seuil (art. L.130-1 II CSS)
      ne s'applique PAS au franchissement du seuil d'un salarié.
